<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  rel="stylesheet" href="style.css">
    <title>TO-DO Listesi</title>
</head>
<body>

    <div id="liste">
        <div id="yapilacaklar" class="kolon">
            <h2>Yapilacaklar</h2>
            <div id="yapilacaklar_icerik"></div>
        </div>
        <div id="devamEdiyor" class="kolon">
            <h2>Devam Edenler</h2>
            <div id="devamEdiyor_icerik"></div>
        </div>
        <div id="tamamlananlar" class="kolon">
            <h2>Tamamlananlar</h2>
            <div id="tamamlananlar_icerik"></div>
        </div>
    </div>
    <form id="form">
        <label>Title</label>
        <input id="f_title" type="text" required><br>
        <label>Description</label>
        <input id="f_desc" type="text" required><br>
        <label>Critical Level</label>
        <select id="f_crlvl" required>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select><br>
        <label>Deadline Date</label>
        <input id="f_date" type="date" required><br>
        <label>Status</label>
        <select id="f_status" required>
            <option value="Yapilacak">Yapilacak</option>
            <option value="Devam Ediyor">Devam Ediyor</option>
            <option value="Tamamlandi">Tamamlandi</option>
        </select><br>
        <button id="buton">Ekle ve Listeyi Guncelle</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
