<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  rel="stylesheet" href="style.css">
    <title>TO-DO Listesi</title>
</head>
<body>
    <h1 id="h1_title">To-Do List</h1>
    <div id="liste">
        <div id="yapilacaklar" class="kolon">
            <h2 id="k1">To-Do</h2>
            <div id="yapilacaklar_icerik"></div>
        </div>
        <div id="devamEdiyor" class="kolon">
            <h2 id="k2">In Progress</h2>
            <div id="devamEdiyor_icerik"></div>
        </div>
        <div id="tamamlananlar" class="kolon">
            <h2 id="k3">Completed</h2>
            <div id="tamamlananlar_icerik"></div>
        </div>
    </div>
    <div id="modal">
        <form id="form">
            <div id="baslik">
                <button id="baslik_buton" class="butonlar">Close</button>
                <h3 id="baslik_yazi">Add New Task</h3>
            </div>
            <label>Title</label>
            <input id="f_title" type="text"><br>
            <label>Description</label>
            <input id="f_desc" type="text"><br>
            <label>Critical Level</label>
            <select id="f_crlvl" class="sel">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select><br>
            <label>Deadline Date</label>
            <input id="f_date" type="date" style="border: 1px solid black;" class="sel"><br>
            <label>Status</label>
            <select id="f_status" class="sel">
                <option value="Yapilacak">To-Do</option>
                <option value="Devam Ediyor">In Progress</option>
                <option value="Tamamlandi">Completed</option>
            </select><br>
            <button id="buton" class="butonlar">Add / Update</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
