<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  rel="stylesheet" href="style.css">
    <title>TO-DO Listesi</title>
</head>
<body>
    <h1 style="border-bottom: 3px solid rgb(137, 105, 44); color: rgb(95, 74, 35);; padding-bottom: 10px;">To-Do List</h1>
    <div id="liste">
        <div id="yapilacaklar" class="kolon">
            <h2 id="k1">To-Do</h2>
            <div id="yapilacaklar_icerik"></div>
        </div>
        <div id="devamEdiyor" class="kolon">
            <h2 id="k2">In Progress</h2>
            <div id="devamEdiyor_icerik"></div>
        </div>
        <div id="tamamlananlar" class="kolon">
            <h2 id="k3">Completed</h2>
            <div id="tamamlananlar_icerik"></div>
        </div>
    </div>
    <form id="form">
        <h3>Add New Task</h3>
        <label>Title</label>
        <input id="f_title" type="text" required><br>
        <label>Description</label>
        <input id="f_desc" type="text" required><br>
        <label>Critical Level</label>
        <select id="f_crlvl" required>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select><br>
        <label>Deadline Date</label>
        <input id="f_date" type="date" required style="border: 1px solid black;"><br>
        <label>Status</label>
        <select id="f_status" required>
            <option value="Yapilacak">To-Do</option>
            <option value="Devam Ediyor">In Progress</option>
            <option value="Tamamlandi">Completed</option>
        </select><br>
        <button id="buton">Add / Update</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
